<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="520" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;display=swap');
    </style>
  </defs>

  <!-- Balle tennis stylisée -->
  <circle cx="55" cy="55" r="42" fill="#B85A20"/>
  <!-- Lignes courbées de balle (sérigraphie tennis) -->
  <path d="M 30 18 Q 55 55 30 92" fill="none" stroke="#F0EBE0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 80 18 Q 55 55 80 92" fill="none" stroke="#F0EBE0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Contour fin -->
  <circle cx="55" cy="55" r="42" fill="none" stroke="#1C3A0E" stroke-width="2"/>

  <!-- Ligne verticale séparatrice -->
  <line x1="118" y1="18" x2="118" y2="92" stroke="#1C3A0E" stroke-width="1.5" opacity="0.3"/>

  <!-- BERGISCHE -->
  <text x="134" y="58"
    font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif"
    font-size="46"
    fill="#1C3A0E"
    letter-spacing="3"
    font-weight="400">BERGISCHE</text>

  <!-- LK-TURNIERE -->
  <text x="134" y="95"
    font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif"
    font-size="36"
    fill="#B85A20"
    letter-spacing="5"
    font-weight="400">LK-TURNIERE</text>

  <!-- Accent line sous BERGISCHE -->
  <line x1="134" y1="64" x2="516" y2="64" stroke="#B85A20" stroke-width="1.5" opacity="0.4"/>
</svg>
