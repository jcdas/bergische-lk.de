<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bergische LK-Turniere | Tennis Turniere im Bergischen Land</title>
  <meta name="description" content="LK-Turniere im Bergischen Land. Offizielle Turniere auf Sandplatz in Wuppertal und Haan. Jetzt anmelden auf mybigpoint.tennis.de">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Bergische LK-Turniere">
  <meta property="og:description" content="Offizielle DTB-Turniere auf Sandplatz im Bergischen Land. ESV Wuppertal West & TC Gruiten.">
  <meta property="og:image" content="https://bergische-lk.de/logo.svg">
  <meta property="og:url" content="https://bergische-lk.de">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-deep: #1C3A0E;
      --green-court: #2D5A18;
      --orange-clay: #B85A20;
      --cream: #F0EBE0;
      --white: #FFFFFF;
      --text-muted: #555555;
      --text-dim: #999999;
      --border-light: #e0dcd4;
      --nav-height: 64px;
      --container: 1100px;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    body {
      font-family: 'Barlow', sans-serif;
      color: var(--green-deep);
      background: var(--cream);
      line-height: 1.6;
      padding-top: var(--nav-height);
    }

    /* --- ACCESSIBILITY --- */
    .skip-link {
      position: absolute; top: -100px; left: 1rem; z-index: 999;
      background: var(--orange-clay); color: var(--white);
      padding: 0.5rem 1rem; border-radius: 4px;
      font-weight: 600; font-size: 0.9rem; text-decoration: none;
      transition: top 150ms ease-out;
    }
    .skip-link:focus { top: 4px; }
    :focus-visible { outline: 2px solid var(--orange-clay); outline-offset: 3px; }

    html { scroll-behavior: smooth; }

    /* --- NAV --- */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--green-deep);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 2rem; height: var(--nav-height);
      box-shadow: 0 1px 0 rgba(255,255,255,0.06);
    }
    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem; color: var(--cream);
      letter-spacing: 2px; text-decoration: none;
      display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0;
    }
    .nav-logo-img { height: 36px; width: auto; }

    /* Desktop section links */
    .nav-links {
      display: flex; align-items: center; gap: 0.1rem;
      margin: 0 1.5rem;
    }
    .nav-links a {
      color: rgba(240,235,224,0.7); text-decoration: none;
      font-weight: 500; font-size: 0.88rem;
      padding: 0.35rem 0.75rem; border-radius: 4px;
      transition: color 150ms var(--ease-out), background-color 150ms var(--ease-out);
      white-space: nowrap;
    }
    @media (hover: hover) and (pointer: fine) {
      .nav-links a:hover { color: var(--cream); background: rgba(255,255,255,0.09); }
    }
    .nav-links .nav-cta {
      background: var(--orange-clay); color: var(--white) !important;
      margin-left: 0.5rem; padding: 0.35rem 1rem;
      font-weight: 600;
    }
    @media (hover: hover) and (pointer: fine) {
      .nav-links .nav-cta:hover { background: #C96425 !important; }
    }

    /* Right cluster: lang + hamburger */
    .nav-right { display: flex; align-items: center; gap: 0.8rem; flex-shrink: 0; }
    .lang-switch {
      display: flex; gap: 0.3rem;
      background: rgba(255,255,255,0.1); border-radius: 4px; padding: 2px;
    }
    .lang-switch button {
      background: none; border: none; color: var(--cream);
      font-family: 'Barlow', sans-serif; font-weight: 600;
      padding: 4px 10px; border-radius: 3px; cursor: pointer;
      font-size: 0.85rem;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
    }
    .lang-switch button.active { background: var(--orange-clay); color: var(--white); }

    /* Hamburger button */
    .nav-hamburger {
      display: none; flex-direction: column; justify-content: center; gap: 5px;
      background: none; border: none; cursor: pointer;
      padding: 6px; color: var(--cream); border-radius: 4px;
      transition: background-color 150ms var(--ease-out);
    }
    .nav-hamburger:hover { background: rgba(255,255,255,0.1); }
    .nav-hamburger span {
      display: block; width: 20px; height: 2px;
      background: currentColor; border-radius: 1px;
      transition: transform 220ms var(--ease-out), opacity 150ms ease-out;
      transform-origin: center;
    }
    .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Mobile slide-down menu */
    .nav-mobile-menu {
      position: fixed; top: var(--nav-height); left: 0; right: 0; z-index: 99;
      background: var(--green-deep);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 1.2rem 1.5rem 2rem;
      visibility: hidden; opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 200ms var(--ease-out),
                  transform 200ms var(--ease-out),
                  visibility 0s 200ms;
    }
    .nav-mobile-menu.open {
      visibility: visible; opacity: 1;
      transform: translateY(0); pointer-events: auto;
      transition: opacity 200ms var(--ease-out),
                  transform 200ms var(--ease-out),
                  visibility 0s;
    }
    .nav-mobile-link {
      display: block; padding: 0.85rem 0.5rem;
      color: rgba(240,235,224,0.8); text-decoration: none;
      font-size: 1.05rem; font-weight: 500;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      transition: color 150ms var(--ease-out);
    }
    .nav-mobile-link:last-of-type { border-bottom: none; }
    @media (hover: hover) and (pointer: fine) {
      .nav-mobile-link:hover { color: var(--cream); }
    }
    .nav-mobile-divider { height: 1px; background: rgba(255,255,255,0.12); margin: 1rem 0; }
    .nav-mobile-cta {
      display: block; margin-top: 0.5rem;
      background: var(--orange-clay); color: var(--white);
      text-decoration: none; text-align: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px;
      padding: 0.9rem; border-radius: 6px;
      transition: background-color 150ms var(--ease-out);
    }
    @media (hover: hover) and (pointer: fine) {
      .nav-mobile-cta:hover { background: #C96425; }
    }

    /* Back to top */
    .back-to-top {
      position: fixed; bottom: 1.8rem; right: 1.8rem; z-index: 90;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--orange-clay); color: var(--white);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(184,90,32,0.4);
      opacity: 0; transform: translateY(10px) scale(0.9);
      transition: opacity 200ms var(--ease-out),
                  transform 200ms var(--ease-out),
                  background-color 150ms var(--ease-out);
      pointer-events: none;
    }
    .back-to-top.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .back-to-top:active { transform: scale(0.92); }
    @media (hover: hover) and (pointer: fine) {
      .back-to-top:hover { background: #C96425; }
    }

    /* Responsive: hide desktop links, show hamburger */
    @media (max-width: 860px) {
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
    }

    /* --- HERO --- */
    .hero {
      position: relative; min-height: calc(100vh - var(--nav-height));
      display: flex; align-items: center; justify-content: center;
      text-align: center; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; background-position: center; background-size: cover;
    }
    .hero-bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(60,30,10,0.72) 0%, rgba(40,20,5,0.55) 100%);
    }
    .hero-content { position: relative; z-index: 2; padding: 2rem; max-width: 800px; }
    .hero-logo { width: 320px; max-width: 80vw; height: auto; margin: 0 auto 1.5rem; }
    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      color: var(--white); letter-spacing: 3px;
      line-height: 1.05; margin-bottom: 0.5rem;
      text-shadow: 0 2px 16px rgba(0,0,0,0.35);
    }
    .hero h1 span { color: var(--cream); }
    .hero .subtitle {
      font-size: 1.3rem; color: rgba(240,235,224,0.95);
      margin-bottom: 0.5rem; font-weight: 500;
      text-shadow: 0 1px 8px rgba(0,0,0,0.25);
    }
    .hero .dates {
      font-size: clamp(1rem, 2vw, 1.2rem); color: rgba(240,235,224,0.8);
      font-weight: 500; letter-spacing: 1px; margin-bottom: 2rem;
    }

    /* --- BUTTONS --- */
    .btn {
      display: inline-block; padding: 1rem 2.5rem;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem;
      letter-spacing: 2px; border: none; border-radius: 4px;
      cursor: pointer; text-decoration: none;
      transition: background-color 160ms var(--ease-out),
                  box-shadow 160ms var(--ease-out),
                  transform 160ms var(--ease-out);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--orange-clay); color: var(--white); }
    .btn-outline { background: transparent; color: var(--cream); border: 2px solid var(--cream); }
    .btn-sm { font-size: 1rem; padding: 0.7rem 1.5rem; }
    @media (hover: hover) and (pointer: fine) {
      .btn-primary:hover {
        background: #D4692A; transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(184,90,32,0.4);
      }
      .btn-outline:hover { background: var(--cream); color: var(--green-deep); }
    }

    /* --- SECTIONS --- */
    section { padding: 5rem 2rem; }
    .container { max-width: var(--container); margin: 0 auto; }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: 2px;
      text-align: center; margin-bottom: 1rem;
    }
    .section-title span { color: var(--orange-clay); }
    .section-subtitle {
      text-align: center; color: var(--text-muted);
      max-width: 600px; margin: 0 auto 3rem;
    }
    .divider {
      width: 60px; height: 4px; background: var(--orange-clay);
      margin: 1rem auto 2rem; border-radius: 2px;
    }

    /* --- TOURNAMENTS --- */
    .turniere { background: var(--cream); }
    .tournament-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .tournament-card {
      background: var(--white); border-radius: 12px; padding: 1.5rem;
      border-left: 4px solid var(--orange-clay);
      box-shadow: 0 2px 12px rgba(28,58,14,0.08);
      transition: transform 250ms var(--ease-out), box-shadow 250ms var(--ease-out);
    }
    @media (hover: hover) and (pointer: fine) {
      .tournament-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(28,58,14,0.12); }
    }
    .tournament-card h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: 1px; margin-bottom: 0.3rem; line-height: 1.1;
    }
    .tournament-card .t-meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.8rem; }
    .tournament-card .t-cats { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .t-cat {
      background: var(--green-court); color: var(--white);
      padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;
    }
    .t-status {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 0.8rem; font-weight: 600; margin-left: auto;
    }
    .t-status.upcoming { background: #E8E4DB; color: #777; }
    .t-status.registration { background: var(--orange-clay); color: var(--white); }
    .t-status.ongoing { background: var(--green-court); color: var(--white); }
    .t-status.completed { background: #ccc; color: #666; }

    /* --- ANLAGEN --- */
    .anlagen { background: var(--white); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
    .card {
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(28,58,14,0.1);
      transition: transform 250ms var(--ease-out), box-shadow 250ms var(--ease-out);
      background: var(--white);
    }
    @media (hover: hover) and (pointer: fine) {
      .card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(28,58,14,0.15); }
    }
    .card-img { height: 220px; background-size: cover; background-position: center; }
    .card-body { padding: 1.5rem; }
    .card-body h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem; letter-spacing: 1px; margin-bottom: 0.5rem; line-height: 1.1;
    }
    .card-body .meta {
      display: flex; flex-direction: column; gap: 0.4rem;
      color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem;
    }
    .card-body .meta svg {
      width: 16px; height: 16px; vertical-align: middle;
      margin-right: 6px; fill: var(--orange-clay);
    }
    .tag {
      display: inline-block; background: var(--green-deep); color: var(--cream);
      padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
    }

    /* --- REGLEMENT --- */
    .reglement { background: var(--green-deep); color: var(--cream); }
    .reglement .section-title { color: var(--cream); }
    .rules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
    .rule-item {
      background: rgba(255,255,255,0.08); border-radius: 10px;
      padding: 1.5rem; border-left: 4px solid var(--orange-clay);
    }
    .rule-item h4 {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem;
      letter-spacing: 1px; margin-bottom: 0.5rem; color: var(--orange-clay);
    }
    .rule-item p { font-size: 0.95rem; color: rgba(240,235,224,0.85); }

    /* --- KATEGORIEN --- */
    .kategorien { background: var(--cream); padding: 3rem 2rem; }
    .kat-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
    .kat-badge {
      background: var(--green-court); color: var(--white);
      padding: 0.8rem 2rem; border-radius: 50px;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 2px;
    }

    /* --- SPONSORING --- */
    .sponsoring { background: var(--white); }
    .packages { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; align-items: start; }
    .package {
      border-radius: 12px; padding: 2rem; text-align: center;
      border: 2px solid var(--border-light);
      transition: border-color 200ms var(--ease-out),
                  transform 200ms var(--ease-out),
                  box-shadow 200ms var(--ease-out);
    }
    .package.featured {
      border-color: var(--orange-clay); border-width: 3px;
      background: linear-gradient(135deg, #FFF8F0, #FFF);
      transform: scale(1.03);
      box-shadow: 0 8px 32px rgba(184,90,32,0.18);
    }
    @media (hover: hover) and (pointer: fine) {
      .package:hover { border-color: var(--orange-clay); transform: translateY(-4px); box-shadow: 0 8px 24px rgba(28,58,14,0.1); }
      .package.featured:hover { transform: scale(1.03) translateY(-4px); }
    }
    .package-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem; letter-spacing: 2px; margin-bottom: 0.5rem;
    }
    .package-badge.bronze { color: #A0522D; }
    .package-badge.silver { color: #808080; }
    .package-badge.gold { color: var(--orange-clay); }
    .package ul { list-style: none; margin: 1.5rem 0; text-align: left; font-size: 0.95rem; }
    .package ul li { padding: 0.4rem 0; padding-left: 1.5rem; position: relative; }
    .package ul li::before { content: '\2713'; position: absolute; left: 0; color: var(--green-court); font-weight: 700; }

    /* --- SOCIAL --- */
    .social-section { background: var(--cream); text-align: center; }
    .social-links { display: flex; justify-content: center; gap: 1.5rem; margin-top: 2rem; flex-wrap: wrap; }
    .social-btn {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.8rem 1.8rem; border-radius: 50px;
      text-decoration: none; font-weight: 600;
      transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
    }
    .social-btn svg { width: 24px; height: 24px; }
    .social-btn.insta { background: linear-gradient(135deg, #833AB4, #FD1D1D, #F77737); color: var(--white); }
    .social-btn.whatsapp { background: #25D366; color: var(--white); }
    @media (hover: hover) and (pointer: fine) {
      .social-btn.insta:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(131,58,180,0.3); }
      .social-btn.whatsapp:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(37,211,102,0.3); }
    }

    /* --- FAQ --- */
    .faq-section { background: var(--white); }
    .faq-item { border-bottom: 1px solid var(--border-light); padding: 1.2rem 0; }
    .faq-item:last-child { border-bottom: none; }
    .faq-q {
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; font-size: 1.05rem; cursor: pointer;
    }
    .faq-q::after {
      content: '+'; font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem; color: var(--orange-clay);
      transition: transform 150ms var(--ease-out);
      flex-shrink: 0; margin-left: 1rem;
    }
    .faq-item.open .faq-q::after { content: '−'; }
    .faq-a {
      max-height: 0; overflow: hidden;
      transition: max-height 250ms var(--ease-out), padding 250ms var(--ease-out);
      color: var(--text-muted); font-size: 0.95rem;
    }
    .faq-item.open .faq-a { max-height: 400px; padding-top: 0.8rem; }

    /* --- NEWSLETTER --- */
    .newsletter { background: var(--green-deep); color: var(--cream); }
    .newsletter .section-title { color: var(--cream); }
    .newsletter-form {
      display: flex; gap: 0.8rem; flex-wrap: wrap;
      max-width: 480px; margin: 0 auto; justify-content: center;
    }
    .newsletter-form input[type="email"] {
      flex: 1; min-width: 200px; padding: 0.8rem 1rem;
      border: 2px solid rgba(240,235,224,0.3);
      border-radius: 4px; background: rgba(255,255,255,0.1);
      color: var(--cream); font-family: 'Barlow', sans-serif; font-size: 1rem;
      transition: border-color 150ms var(--ease-out);
    }
    .newsletter-form input[type="email"]::placeholder { color: rgba(240,235,224,0.5); }
    .newsletter-form input[type="email"]:focus { outline: none; border-color: var(--orange-clay); }

    /* --- CONTACT --- */
    .contact { background: var(--green-court); color: var(--cream); text-align: center; }
    .contact .section-title { color: var(--cream); }
    .contact a { color: var(--orange-clay); text-decoration: none; }
    .contact a:hover { text-decoration: underline; }

    /* --- FOOTER --- */
    footer {
      background: #111; color: var(--text-dim); text-align: center;
      padding: 2rem; font-size: 0.85rem;
    }
    footer a { color: var(--orange-clay); text-decoration: none; }

    /* --- GALERIE --- */
    .galerie { background: var(--green-deep); color: var(--cream); }
    .galerie .section-title { color: var(--cream); }
    .galerie .section-subtitle { color: rgba(240,235,224,0.7); }
    .galerie-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .galerie-card {
      position: relative; overflow: hidden; border-radius: 10px;
      aspect-ratio: 4 / 3; cursor: default;
      background: rgba(255,255,255,0.06);
    }
    .galerie-card-img {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      transition: transform 400ms var(--ease-out);
    }
    .galerie-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,25,5,0.88) 0%, rgba(10,25,5,0.2) 60%, transparent 100%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 1.2rem;
    }
    .galerie-card-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem; letter-spacing: 1px; color: var(--white);
      line-height: 1.2; margin-bottom: 0.25rem;
    }
    .galerie-card-meta {
      font-size: 0.8rem; color: rgba(240,235,224,0.75);
      display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    }
    .galerie-card-meta .dot { opacity: 0.4; }
    .galerie-placeholder-badge {
      position: absolute; top: 0.75rem; right: 0.75rem;
      background: rgba(0,0,0,0.5); color: rgba(240,235,224,0.7);
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px;
      padding: 3px 8px; border-radius: 4px;
      backdrop-filter: blur(4px);
    }
    @media (hover: hover) and (pointer: fine) {
      .galerie-card:hover .galerie-card-img { transform: scale(1.04); }
    }
    .galerie-note {
      text-align: center; margin-top: 2rem;
      font-size: 0.8rem; color: rgba(240,235,224,0.4);
    }

<script>
/* ── Language engine ──────────────────────────────────── */
let LANG = localStorage.getItem('lang') || 'de';

function t(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[LANG] || obj.de || '';
}

function setLang(lang) {
  LANG = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-switch button').forEach(b => {
    const active = b.textContent.trim() === lang.toUpperCase();
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  localStorage.setItem('lang', lang);
  render();
}

function toggleFaq(el) {
  const isOpen = el.classList.toggle('open');
  el.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

/* ── SVG icons (reusable) ─────────────────────────────── */

  whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>',
};

/* ── Status labels ────────────────────────────────────── */
const STATUS = {
  upcoming:     { de: 'Demnächst', en: 'Upcoming' },
  registration: { de: 'Anmeldung offen', en: 'Registration open' },
  ongoing:      { de: 'Laufend', en: 'Ongoing' },
  completed:    { de: 'Abgeschlossen', en: 'Completed' },
};

/* ── Render everything ────────────────────────────────── */
function render() {
  const D = SITE;

  // data-de / data-en elements
  document.querySelectorAll('[data-de]').forEach(el => {
    el.innerHTML = el.dataset[LANG] || el.dataset.de;
  });

  // Nav logo — SVG inline, ne pas écraser

  // Hero
  document.getElementById('hero-bg').style.backgroundImage = `url('${D.hero.image}')`;
  document.getElementById('hero-title').innerHTML = t(D.hero.title);
  document.getElementById('hero-subtitle').textContent = t(D.hero.subtitle);
  document.getElementById('hero-dates').textContent = `${t(D.season.label)} — ${t(D.season.status)}`;
  // hero CTA removed — single "Unsere Turniere" button handled via data-de/data-en

  // Tournaments
  const tList = document.getElementById('tournament-list');
  tList.innerHTML = D.tournaments.map(tr => {
    const venue = D.venues.find(v => v.id === tr.venue);
    const link = tr.mybigpoint
      ? `<a href="${tr.mybigpoint}" target="_blank" rel="noopener" class="btn btn-primary btn-sm" style="margin-top:0.8rem">${LANG === 'de' ? 'JETZT ANMELDEN' : 'REGISTER NOW'}</a>`
      : '';
    return `<div class="tournament-card">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <h3>${tr.name}</h3>
        <span class="t-status ${tr.status}">${t(STATUS[tr.status])}</span>
      </div>
      <div class="t-meta">${venue ? venue.name : ''} · ${t(tr.dates)}</div>
      <div class="t-cats">${tr.categories.map(c => `<span class="t-cat">${c}</span>`).join('')}</div>
      ${link}
    </div>`;
  }).join('');

  // Venues
  const vCards = document.getElementById('venue-cards');
  vCards.innerHTML = D.venues.map(v => `
    <div class="card">
      <div class="card-img" style="background-image:url('${v.image}')"></div>
      <div class="card-body">
        <h3>${v.name}</h3>
        <div class="meta">
          <span>${ICONS.pin} <a href="${v.maps}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${v.address}</a></span>
          <span>${ICONS.court} ${v.courts} ${t(v.surface)}</span>
        </div>
        <span class="tag">SANDPLATZ</span>
      </div>
    </div>
  `).join('');

  // Rules
  const rGrid = document.getElementById('rules-grid');
  rGrid.innerHTML = D.rules.map(r => `
    <div class="rule-item">
      <h4>${t(r.title)}</h4>
      <p>${t(r.text)}</p>
    </div>
  `).join('');

  // Categories
  const kList = document.getElementById('kat-list');
  kList.innerHTML = D.categories.map(c => `<div class="kat-badge">${c}</div>`).join('');

  // Galerie
  const galerieGrid = document.getElementById('galerie-grid');
  const galerieNote = document.getElementById('galerie-note');
  const past = D.pastTournaments || [];
  if (past.length) {
    galerieGrid.innerHTML = past.map(p => {
      const venue = D.venues.find(v => v.id === p.venue);
      const venueName = venue ? venue.name : '';
      const playersLabel = LANG === 'de' ? `${p.players} Spieler` : `${p.players} players`;
      const badge = p.placeholder
        ? `<span class="galerie-placeholder-badge">${LANG === 'de' ? 'Foto folgt' : 'Photo TBC'}</span>`
        : '';
      return `<div class="galerie-card">
        <div class="galerie-card-img" style="background-image:url('${p.cover}')"></div>
        ${badge}
        <div class="galerie-card-overlay">
          <div class="galerie-card-name">${t(p.name)}</div>
          <div class="galerie-card-meta">
            <span>${t(p.date)}</span>
            <span class="dot">·</span>
            <span>${venueName}</span>
            <span class="dot">·</span>
            <span>${playersLabel}</span>
          </div>
        </div>
      </div>`;
    }).join('');
    galerieNote.textContent = LANG === 'de'
      ? 'Fotos von Spielern werden nur mit ausdrücklicher Einwilligung veröffentlicht (KUG §22).'
      : 'Photos of players are only published with explicit consent (KUG §22).';
  }

  // Sponsoring
  const pkgs = document.getElementById('packages');
  pkgs.innerHTML = D.sponsoring.map(s => `
    <div class="package${s.featured ? ' featured' : ''}">
      <div class="package-badge ${s.tier}">${s.label}</div>
      <ul>${s.perks.map(p => `<li>${t(p)}</li>`).join('')}</ul>
      <a href="mailto:${D.email}?subject=Sponsoring%20${s.label}" class="btn btn-primary btn-sm">KONTAKT</a>
    </div>
  `).join('');

  // Social
  const sLinks = document.getElementById('social-links');
  sLinks.innerHTML = `
    <a href="${D.social.instagram}" target="_blank" rel="noopener" class="social-btn insta">${ICONS.instagram} Instagram</a>
    <a href="${D.social.whatsapp}" target="_blank" rel="noopener" class="social-btn whatsapp">${ICONS.whatsapp} WhatsApp</a>
  `;

  // FAQ
  const faqList = document.getElementById('faq-list');
  faqList.innerHTML = D.faq.map((f, i) => `
    <div class="faq-item"
         role="button" tabindex="0"
         aria-expanded="false" aria-controls="faq-a-${i}"
         onclick="toggleFaq(this)"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleFaq(this)}">
      <div class="faq-q">${t(f.q)}</div>
      <div class="faq-a" id="faq-a-${i}">${t(f.a)}</div>
    </div>
  `).join('');

  // Newsletter
  const nl = D.newsletter;
  const nlSection = document.getElementById('newsletter-section');
  if (nl && nl.enabled) {
    nlSection.style.display = '';
    document.getElementById('newsletter-text').textContent = t(nl.text);
    document.getElementById('newsletter-email').placeholder = t(nl.placeholder);
    document.getElementById('newsletter-btn').textContent = t(nl.cta);
    document.getElementById('nl-consent-label').innerHTML = LANG === 'de'
      ? 'Ich stimme zu, E-Mails über Turniere zu erhalten. Widerruf jederzeit möglich. <a href="legal.html" style="color:var(--orange-clay);">Datenschutzerklärung</a>'
      : 'I agree to receive tournament emails. Unsubscribe anytime. <a href="legal.html" style="color:var(--orange-clay);">Privacy Policy</a>';
    const nlForm = document.getElementById('newsletter-form');
    if (nl.action) {
      nlForm.action = nl.action;
    } else {
      nlForm.action = 'mailto:' + D.email;
      nlForm.method = 'GET';
    }
    // Require consent before newsletter submit
    nlForm.onsubmit = function(e) {
      if (!document.getElementById('nl-consent').checked) {
        e.preventDefault();
        alert(LANG === 'de' ? 'Bitte stimmen Sie der Datenschutzerklärung zu.' : 'Please accept the Privacy Policy.');
        return false;
      }
    };
  } else {
    nlSection.style.display = 'none';
  }

  // Contact
  const orgLabel = LANG === 'de' ? 'Organisator' : 'Organizer';
  document.getElementById('contact-info').textContent = `${D.organizerShort} — ${orgLabel}`;
  const emailEl = document.getElementById('contact-email');
  emailEl.href = `mailto:${D.email}`;
  emailEl.textContent = D.email;

  // Footer
  const rights = LANG === 'de' ? 'Alle Rechte vorbehalten.' : 'All rights reserved.';
  document.getElementById('footer-copy').innerHTML = `&copy; ${D.year} ${D.name}. ${rights}`;
}

// Cookie banner
function showCookieBanner() {
  if (localStorage.getItem('cookie_ok')) return;
  const b = document.getElementById('cookie-banner');
  b.style.display = 'flex';
  document.getElementById('cookie-text').textContent = LANG === 'de'
    ? 'Diese Website verwendet keine Tracking-Cookies. Wir speichern lediglich Ihre Sprachpräferenz.'
    : 'This website does not use tracking cookies. We only store your language preference.';
  document.getElementById('cookie-btn').textContent = LANG === 'de' ? 'Verstanden' : 'Got it';
}
function dismissCookie() {
  localStorage.setItem('cookie_ok', '1');
  document.getElementById('cookie-banner').style.display = 'none';
}

// Mobile menu
function toggleMobileMenu() {
  const menu = document.getElementById('nav-mobile-menu');
  const btn  = document.getElementById('nav-hamburger');
  const open = menu.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.setAttribute('aria-label', open ? (LANG === 'de' ? 'Menü schließen' : 'Close menu') : (LANG === 'de' ? 'Menü öffnen' : 'Open menu'));
  menu.setAttribute('aria-hidden', open ? 'false' : 'true');
  document.body.style.overflow = open ? 'hidden' : '';
}
function closeMobileMenu() {
  const menu = document.getElementById('nav-mobile-menu');
  const btn  = document.getElementById('nav-hamburger');
  menu.classList.remove('open');
  btn.classList.remove('open');
  btn.setAttribute('aria-expanded', 'false');
  menu.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
document.addEventListener('click', e => {
  const menu = document.getElementById('nav-mobile-menu');
  const btn  = document.getElementById('nav-hamburger');
  if (menu && menu.classList.contains('open') && !menu.contains(e.target) && !btn.contains(e.target)) closeMobileMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMobileMenu(); });

// Back to top
window.addEventListener('scroll', () => {
  const btn = document.getElementById('back-to-top');
  if (btn) btn.classList.toggle('visible', window.scrollY > 300);
}, { passive: true });

// Init
setLang(LANG);
showCookieBanner();
</script>

</body>
</html>
